name: Build, test and publish artefacts

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        server-username: GITHUB_ACTOR # env var provided automatically in actions
        server-password: GITHUB_TOKEN # env var provided automatically in actions
    - name: Build with Maven
      run: mvn --batch-mode clean compile test --file pom.xml
    - name: Publish to GitHub Packages Apache Maven
      run: mvn --batch-mode deploy --file pom.xml -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
